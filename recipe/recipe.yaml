schema_version: 1

context:
  version: "0.1.38"

package:
  name: kagglesdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kagglesdk/kagglesdk-${{ version }}.tar.gz
  sha256: fe4033537e8546b7a3ff77da183c3410b189eb8793a7573c58780eb14f5fd5c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - requests
    - protobuf

tests:
  - python:
      imports:
        - kagglesdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Kaggle/kagglesdk
  repository: https://github.com/Kaggle/kagglesdk
  summary: Bindings to access kaggle's external-facing APIs
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - synapticarbors
